<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>松烟键盘外观编辑器</title>
  <meta name="description" content="编辑松烟键盘外观文件，实时预览，导出后导入松烟。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a593f'/%3E%3Cpath d='M12 25c-3-3 3-5 1-9s4-5 3-9M19 25c-2-3 2-4 1-7s2-4 1-6' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="currentColor"/>
        <path d="M12 25c-3-3 3-5 1-9s4-5 3-9M19 25c-2-3 2-4 1-7s2-4 1-6" fill="none" stroke="var(--accent-text)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1 id="title" data-i18n="title">松烟键盘外观编辑器</h1>
    </div>
    <div class="seg lang" role="group" aria-label="语言" data-i18n-aria="langLabel">
      <button type="button" data-lang="zh" lang="zh-CN" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    </div>
  </header>
  <p class="intro" data-i18n="intro"></p>

  <main class="layout">
    <section class="edit-col">
      <div class="card" id="start-card">
        <div class="start-row">
          <label for="preset" class="visually-hidden" data-i18n="startMenu"></label>
          <select id="preset"></select>
          <button type="button" class="btn" id="import-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
            <span data-i18n="importFile"></span>
          </button>
          <button type="button" class="btn" id="paste-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6M9.5 3h5a1 1 0 0 1 1 1v1.5h-7V4a1 1 0 0 1 1-1zM8.5 4.5H7a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V6A1.5 1.5 0 0 0 17 4.5h-1.5"/></svg>
            <span data-i18n="pasteJson"></span>
          </button>
          <input type="file" id="file" accept=".json,application/json" class="visually-hidden" tabindex="-1" aria-hidden="true">
        </div>
        <div class="messages" id="messages" role="status" aria-live="polite"></div>
        <p class="note start-hint" data-i18n="autosaveNote"></p>
      </div>
      <form id="form" onsubmit="return false"></form>
    </section>

    <aside class="preview-col">
      <div class="card preview-card">
        <div class="title-line">
          <h2 id="preview-heading" data-i18n="preview"></h2>
          <span class="note"><span data-i18n="editing"></span>：<strong id="doc-name"></strong></span>
        </div>
        <div class="toggles">
          <div class="seg" role="group" id="top-seg" data-i18n-aria="previewTopLabel">
            <button type="button" data-top="candidates" aria-pressed="true" data-i18n="previewTyping"></button>
            <button type="button" data-top="toolbar" aria-pressed="false" data-i18n="previewToolbar"></button>
          </div>
          <div class="seg" role="group" id="mode-seg" data-i18n-aria="previewModeLabel">
            <button type="button" data-mode="light" aria-pressed="true" data-i18n="previewLight"></button>
            <button type="button" data-mode="dark" aria-pressed="false" data-i18n="previewDark"></button>
          </div>
          <div class="seg" role="group" id="platform-seg" data-i18n-aria="previewPlatformLabel">
            <button type="button" data-platform="android" aria-pressed="true" data-i18n="previewAndroid"></button>
            <button type="button" data-platform="iphone" aria-pressed="false" data-i18n="previewIphone"></button>
          </div>
        </div>
        <div class="pv-device" id="preview" aria-labelledby="preview-heading" role="group"></div>
        <p class="note preview-note" id="preview-note"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="download-btn" data-i18n="download"></button>
        <button type="button" class="btn" id="copy-btn" data-i18n="copy"></button>
        <button type="button" class="btn" id="share-btn" data-i18n="share" hidden></button>
      </div>
      <div class="messages export-messages" id="export-messages" role="status" aria-live="polite"></div>
    </aside>
  </main>

  <footer class="page-footer">
    <ul class="footer-links">
      <li><a href="https://github.com/Suzukaa-a/songyan-themes" target="_blank" rel="noopener" data-i18n="footGithub"></a></li>
      <li><a href="https://github.com/Suzukaa-a/songyan-themes/blob/main/FORMAT.md" target="_blank" rel="noopener" data-i18n="footFormat"></a></li>
      <li><a href="https://github.com/Suzukaa-a/songyan-android" target="_blank" rel="noopener" data-i18n="footAndroid"></a></li>
      <li><a href="https://github.com/Suzukaa-a/songyan-ios" target="_blank" rel="noopener" data-i18n="footIos"></a></li>
      <li><a href="https://github.com/Suzukaa-a/songyan-themes/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="footLicense"></a></li>
    </ul>
    <p data-i18n="footPrivacy"></p>
  </footer>

  <dialog id="paste-dialog" aria-labelledby="paste-title">
    <form method="dialog" class="dialog-form" id="paste-form">
      <h2 id="paste-title" data-i18n="pasteTitle"></h2>
      <label for="paste-text" class="visually-hidden" data-i18n="pasteLabel"></label>
      <textarea id="paste-text" spellcheck="false" autocomplete="off" aria-describedby="paste-error"></textarea>
      <p class="dialog-error" id="paste-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="paste-cancel" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" id="paste-import" data-i18n="pasteImport"></button>
      </div>
    </form>
  </dialog>

  <noscript><p class="intro">需要 JavaScript 才能使用编辑器。 / This editor needs JavaScript.</p></noscript>
  <script>
    // Some browsers refuse ES modules on file://. Say so instead of showing a dead page.
    setTimeout(function () {
      if (window.__songyanReady) return;
      var note = document.createElement('p');
      note.className = 'intro';
      note.textContent = '页面无法启动，请通过网页服务器打开（例如在这个文件夹运行 python3 -m http.server）。 / The page could not start. Open it through a web server, e.g. python3 -m http.server in this folder.';
      document.querySelector('.layout').before(note);
    }, 1500);
  </script>
  <div class="drop-hint" id="drop-hint" aria-hidden="true"><span data-i18n="dropHint"></span></div>
</body>
</html>
